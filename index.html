<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BACKSWING — Strength &amp; Mobility</title>
<meta name="description" content="A 12-week strength and mobility program for golfers with a baseball past. Logs your sets, times your rest, works offline.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-title" content="Backswing">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0b0f14; --bg2:#111823; --card:#151d29; --card2:#1b2533;
  --line:#25324a; --line2:#2f405c;
  --tx:#e8eef7; --tx2:#9fb0c7; --tx3:#6b7d96;
  --acc:#39d98a;      /* strength / go */
  --acc2:#4aa8ff;     /* mobility */
  --acc3:#ffb547;     /* power */
  --acc4:#ff6b6b;     /* conditioning */
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:none}
body{padding-bottom:calc(78px + var(--safe-b));transition:padding-bottom .2s}
body.timer-on{padding-bottom:calc(158px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--acc2)}
.hide{display:none !important}

/* ---------- layout ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:40;background:rgba(11,15,20,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.brand span{color:var(--acc)}
.top-sub{font-size:12px;color:var(--tx3);letter-spacing:.02em;margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;color:var(--tx2)}
.iconbtn:active{background:var(--card2)}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(13,18,26,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tx3);font-size:10.5px;font-weight:600;letter-spacing:.02em;transition:color .15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.flat{background:var(--bg2)}
.sect-t{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin:22px 0 8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13.5px}
.tiny{color:var(--tx3);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--card2);color:var(--tx2);border:1px solid var(--line2)}
.pill.strength{background:rgba(57,217,138,.13);color:var(--acc);border-color:rgba(57,217,138,.3)}
.pill.mobility{background:rgba(74,168,255,.13);color:var(--acc2);border-color:rgba(74,168,255,.3)}
.pill.power{background:rgba(255,181,71,.13);color:var(--acc3);border-color:rgba(255,181,71,.3)}
.pill.cond{background:rgba(255,107,107,.13);color:var(--acc4);border-color:rgba(255,107,107,.3)}
.pill.rest{background:var(--card2);color:var(--tx3)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:14px;background:var(--acc);color:#06231a;
  font-weight:800;font-size:15.5px;letter-spacing:.01em;box-shadow:0 4px 16px rgba(57,217,138,.22)}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.btn.gho{background:transparent;color:var(--tx2);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}
.btn.blue{background:var(--acc2);color:#04223f;box-shadow:0 4px 16px rgba(74,168,255,.22)}
.btn.danger{background:transparent;color:var(--acc4);border:1px solid rgba(255,107,107,.35);box-shadow:none}

/* ---------- today hero ---------- */
.hero{background:linear-gradient(160deg,#172233 0%,#131a26 60%,#141d2b 100%);
  border:1px solid var(--line2);border-radius:20px;padding:18px;margin:14px 0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;
  background:radial-gradient(circle,rgba(57,217,138,.20),transparent 65%);pointer-events:none}
.hero-k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.hero h2{font-size:25px;margin:5px 0 3px;line-height:1.15}
.hero .meta{font-size:13px;color:var(--tx2)}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 15px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:21px;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* week dots */
.wkdots{display:flex;gap:6px;justify-content:space-between;margin-top:4px}
.wkdot{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.wkdot i{width:100%;height:6px;border-radius:4px;background:var(--line);display:block}
.wkdot.done i{background:var(--acc)}
.wkdot.today i{background:var(--acc3)}
.wkdot em{font-style:normal;font-size:10px;color:var(--tx3);font-weight:700}

/* ---------- exercise rows ---------- */
.exlist{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:rgba(57,217,138,.4);background:linear-gradient(180deg,rgba(57,217,138,.07),transparent)}
.ex-h{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ex-n{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--tx2)}
.ex.done .ex-n{background:var(--acc);border-color:var(--acc);color:#06231a}
.ex-t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ex-s{font-size:12.5px;color:var(--tx3);margin-top:2px}
.chev{color:var(--tx3);font-size:13px;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.ex-b{border-top:1px solid var(--line);padding:13px 14px;display:none;background:rgba(0,0,0,.14)}
.ex.open .ex-b{display:block}
.cue{font-size:13px;color:var(--tx2);background:var(--bg2);border-left:2px solid var(--acc2);
  padding:9px 11px;border-radius:0 9px 9px 0;margin-bottom:12px}
.cue b{color:var(--tx);font-weight:700}

/* set grid */
.setg{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:7px;align-items:center;margin-bottom:7px}
.setg.head{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:5px}
.setg .sn{text-align:center;font-size:12.5px;font-weight:800;color:var(--tx3)}
.inp{width:100%;padding:11px 8px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);
  text-align:center;font-size:15px;font-weight:600;outline:none;min-width:0}
.inp:focus{border-color:var(--acc2);background:#0f1620}
.inp::placeholder{color:var(--tx3);font-weight:400}
.chk{width:44px;height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:16px;color:var(--tx3)}
.chk.on{background:var(--acc);border-color:var(--acc);color:#06231a}
.prev{font-size:11.5px;color:var(--tx3);margin-top:8px}

/* ---------- plan / weeks ---------- */
.phase{border-radius:var(--r);padding:14px 16px;margin:16px 0 8px;border:1px solid var(--line2)}
.phase.p1{background:linear-gradient(135deg,rgba(74,168,255,.13),rgba(74,168,255,.03))}
.phase.p2{background:linear-gradient(135deg,rgba(57,217,138,.13),rgba(57,217,138,.03))}
.phase.p3{background:linear-gradient(135deg,rgba(255,181,71,.13),rgba(255,181,71,.03))}
.phase h3{font-size:17px}
.phase p{margin:5px 0 0;font-size:13px;color:var(--tx2)}
.wk{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:8px 0;overflow:hidden}
.wk-h{display:flex;align-items:center;gap:11px;padding:13px 14px}
.wk-h b{font-size:14.5px}
.wk-b{display:none;border-top:1px solid var(--line);padding:6px 0}
.wk.open .wk-b{display:block}
.dayrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid rgba(37,50,74,.5)}
.dayrow:last-child{border-bottom:none}
.dayrow .dn{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--card2);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--tx3)}
.dayrow.done .dn{background:var(--acc);color:#06231a}
.dayrow .t{font-size:14px;font-weight:600}
.dayrow .s{font-size:11.5px;color:var(--tx3);margin-top:1px}

/* ---------- timer ---------- */
.timerbar{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:45;
  padding:0 16px;pointer-events:none}
.timerbar-in{max-width:560px;margin:0 auto;background:rgba(21,29,41,.97);border:1px solid var(--line2);
  border-radius:15px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);pointer-events:auto}
.tval{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:76px}
.tval.warn{color:var(--acc3)}

/* ---------- charts ---------- */
.chartbox{margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:6px}
.barc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--acc),rgba(57,217,138,.35));min-height:3px;transition:height .4s}
.bar.blue{background:linear-gradient(180deg,var(--acc2),rgba(74,168,255,.35))}
.barc em{font-style:normal;font-size:9.5px;color:var(--tx3);font-weight:700}

/* ---------- misc ---------- */
.search{width:100%;padding:13px 15px;border-radius:13px;background:var(--card);
  border:1px solid var(--line2);outline:none;font-size:15px}
.search:focus{border-color:var(--acc2)}
.seg{display:flex;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--tx3)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{width:50px;height:29px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 50px;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(21px)}
.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .ic{font-size:38px;margin-bottom:10px;opacity:.5}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line2);
  padding:8px 16px calc(24px + var(--safe-b));max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-width:560px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:6px auto 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(96px + var(--safe-b));
  background:var(--card2);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.hero h2{font-size:22px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="grow">
      <div class="brand">BACK<span>SWING</span></div>
      <div class="top-sub" id="topSub">Week 1 · Rebuild</div>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="btnTimer" title="Rest timer">&#9201;</button>
      <button class="iconbtn" id="btnSettings" title="Settings">&#9881;</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="timerbar hide" id="timerBar">
  <div class="timerbar-in">
    <div class="tval" id="tVal">1:30</div>
    <div class="grow"><div style="font-size:12px;font-weight:700" id="tLabel">Rest</div>
      <div class="tiny" id="tSub">tap +30 to extend</div></div>
    <button class="btn sm sec" id="tPlus">+30s</button>
    <button class="btn sm gho" id="tStop">Stop</button>
  </div>
</div>

<nav class="tabs">
  <div class="tabs-in" id="tabs">
    <button class="tab on" data-v="today"><svg viewBox="0 0 24 24"><path d="M3 12l2-2 4 4 8-8 4 4"/><path d="M3 19h18"/></svg>Today</button>
    <button class="tab" data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Plan</button>
    <button class="tab" data-v="mobility"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v6M12 13l-3.5 6M12 13l3.5 6M6.5 10h11"/></svg>Mobility</button>
    <button class="tab" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
    <button class="tab" data-v="library"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 17.5h16"/></svg>Library</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   BACKSWING — strength & mobility for a former ballplayer who golfs
   Single file. No external dependencies.
   ========================================================================= */

/* ---------------- EXERCISE LIBRARY ---------------- */
/* cue = how to do it + why it matters for golf / a rebuilt baseball body */
const EX = {
/* --- mobility & prep --- */
"cat-cow":{n:"Cat-Cow",c:"mob",e:"none",cue:"On all fours. Segment the spine one vertebra at a time, don't just flop between end ranges. <b>Why:</b> wakes up spinal segmentation so rotation comes from the whole chain, not one hinge point in your low back."},
"open-book":{n:"Open Book T-Spine Rotation",c:"mob",e:"none",cue:"Side-lying, knees stacked at 90°, top arm sweeps open and reaches for the floor behind you. Exhale at end range, hold 2s. <b>Why:</b> t-spine rotation is the #1 limiter of backswing turn — lose it and your low back and lead shoulder pay for it."},
"tspine-ext":{n:"T-Spine Extension over Roller",c:"mob",e:"roller",cue:"Roller across mid-back, hands behind head, ribs down. Extend over the roller for 3 slow breaths, move up an inch, repeat. <b>Why:</b> restores extension so you can get your arms overhead without arching the lumbar."},
"9090":{n:"90/90 Hip Switch",c:"mob",e:"none",cue:"Seated, both knees at 90°. Switch side to side under control, chest tall. Pause 2s at each end. <b>Why:</b> internal rotation of the lead hip is what lets you clear through impact instead of sliding."},
"hip-airplane":{n:"Standing Hip Airplane",c:"mob",e:"none",cue:"Balance on one leg, hinge to ~45°, rotate pelvis open then closed over the standing femur. Slow. <b>Why:</b> teaches the hip to rotate on a stable femur — literally the downswing pattern."},
"adductor-rock":{n:"Adductor Rock-Back",c:"mob",e:"none",cue:"All fours, one leg out to the side, rock hips back. Keep the extended foot flat. <b>Why:</b> adductor length feeds hip turn and protects the groin during rotational work."},
"couch":{n:"Couch Stretch",c:"mob",e:"none",cue:"Rear foot elevated on a couch/bench, squeeze the glute of the back leg HARD, tuck the tailbone. 45s/side. <b>Why:</b> hip flexors shorten from sitting and pull you into a tilted pelvis that kills rotation."},
"wgs":{n:"World's Greatest Stretch",c:"mob",e:"none",cue:"Lunge, elbow to instep, then rotate the same-side arm to the sky and follow it with your eyes. <b>Why:</b> hits hip flexors, adductors and t-spine in one shot — best 60-second cost/benefit in the warm-up."},
"ankle-rock":{n:"Ankle Dorsiflexion Rock",c:"mob",e:"none",cue:"Half-kneeling, drive the knee forward over the pinky toe without the heel lifting. <b>Why:</b> stiff ankles force early extension and steal depth from your squat."},
"wall-slide":{n:"Wall Slide w/ Lift-off",c:"mob",e:"wall",cue:"Forearms on wall, slide up, lift off 1 inch at the top. Ribs stay down. <b>Why:</b> retrains upward scap rotation — the fix for the cranky throwing shoulder."},
"scap-pushup":{n:"Scap Push-Up",c:"mob",e:"none",cue:"Top of a push-up, arms locked. Only the shoulder blades move — protract, retract. <b>Why:</b> serratus control is shoulder insurance for anyone with mileage on their arm."},
"band-pullapart":{n:"Band Pull-Apart",c:"mob",e:"band",cue:"Arms straight, pull the band to your chest, thumbs back at the end. Don't shrug. <b>Why:</b> cheap, high-volume posterior shoulder work that keeps the front of the shoulder quiet."},
"posterior-cuff":{n:"Cross-Body Posterior Cuff Stretch",c:"mob",e:"none",cue:"Pull the arm across the body with the shoulder blade pinned down. 30s/side. Never force it. <b>Why:</b> throwing shoulders lose internal rotation — that deficit shows up as pain and a stuck follow-through."},
"club-rot":{n:"Golf-Posture Rotation Drill",c:"mob",e:"club",cue:"Club across the shoulders, set your address posture, rotate back and through keeping the spine angle. 12 slow, 12 at tempo. <b>Why:</b> rehearses separation between hips and shoulders in the exact posture you play from."},
"deadbug":{n:"Dead Bug",c:"core",e:"none",cue:"Low back glued to the floor. Exhale fully as the opposite arm and leg extend. Stop the rep before the back arches. <b>Why:</b> anti-extension core is what keeps rotational power from leaking into your lumbar spine."},
"birddog":{n:"Bird Dog",c:"core",e:"none",cue:"Reach long, not high. Hips stay square — imagine a glass of water on your low back. <b>Why:</b> teaches the trunk to stay quiet while the limbs move fast."},
"glute-bridge":{n:"Glute Bridge",c:"mob",e:"none",cue:"Posteriorly tilt the pelvis first, then lift. Ribs down. Squeeze 2s at the top. <b>Why:</b> wakes glutes that go to sleep from desk time."},
"pogo":{n:"Pogo Hops",c:"pow",e:"none",cue:"Stiff ankles, minimal knee bend, quick off the ground. Quiet landings. <b>Why:</b> restores tendon stiffness — the free elasticity you had at 21."},

/* --- lower --- */
"goblet-squat":{n:"Goblet Squat",c:"str",e:"db",cue:"Elbows inside the knees at the bottom, chest tall, sit between the ankles. Pause 1s in the hole. <b>Why:</b> re-teaches squat depth with a self-correcting load position."},
"back-squat":{n:"Back Squat",c:"str",e:"bb",cue:"Big brace before you unrack. Sit down, not back. Knees track over mid-foot. <b>Why:</b> the base of everything — leg strength is the floor your power sits on."},
"front-squat":{n:"Front Squat",c:"str",e:"bb",cue:"Elbows UP the entire set. The bar sits on the shelf of your shoulders, hands are just a strap. <b>Why:</b> forces an upright torso and loads the quads without hammering the low back."},
"rfe-split":{n:"Rear-Foot-Elevated Split Squat",c:"str",e:"db",cue:"Front shin near vertical, back knee to just above the floor, torso a hair forward. Slow down, drive up. <b>Why:</b> the single best builder of single-leg strength and hip stability for a rotational athlete."},
"rev-lunge":{n:"Reverse Lunge",c:"str",e:"db",cue:"Step back, drop straight down, push through the front heel to return. <b>Why:</b> knee-friendly single-leg strength that trains deceleration."},
"stepup":{n:"Dumbbell Step-Up",c:"str",e:"db",cue:"Box at knee height. Don't push off the back foot — the top leg does all the work. <b>Why:</b> builds the hip extension you need for ground force in the downswing."},
"trapbar-dl":{n:"Trap-Bar Deadlift",c:"str",e:"bb",cue:"Hips between a squat and a hinge, chest up, push the floor away. Reset every rep. <b>Why:</b> maximum total-body strength with the least spinal shear — the smart pull for a 30-something."},
"rdl":{n:"Romanian Deadlift",c:"str",e:"bb",cue:"Soft knees, push the hips back, bar stays on the legs. Stop when the hamstrings say stop, not when the bar hits the floor. <b>Why:</b> hamstring/glute strength = a stable base to rotate against."},
"sl-rdl":{n:"Single-Leg RDL",c:"str",e:"db",cue:"Hips square, back leg like a tail. Slow. Balance is part of the exercise. <b>Why:</b> exposes and fixes the left/right asymmetry every rotational sport builds in."},
"hip-thrust":{n:"Hip Thrust",c:"str",e:"bb",cue:"Chin tucked, ribs down, squeeze 1s at the top. Full lockout, no lumbar arch. <b>Why:</b> horizontal hip power — the direction golf actually needs."},
"nordic":{n:"Slider Hamstring Curl",c:"str",e:"none",cue:"Bridge held the whole time. Slide heels out slowly, pull back with the hamstrings. <b>Why:</b> eccentric hamstring strength is the best hamstring-injury insurance there is."},
"calf":{n:"Standing Calf Raise",c:"str",e:"db",cue:"Full stretch at the bottom, 2s squeeze at the top. <b>Why:</b> ankles and calves are your first contact with the ground; stiff, strong ones transfer force."},

/* --- upper --- */
"pushup":{n:"Push-Up",c:"str",e:"none",cue:"Body one plank, elbows ~45°, shoulder blades move at the top. <b>Why:</b> restores pressing strength with the scapula free to move — easier on old shoulders than a bar."},
"db-bench":{n:"Dumbbell Bench Press",c:"str",e:"db",cue:"Shoulder blades pinched and pulled down, dumbbells stack over the elbows. <b>Why:</b> pressing strength with a range of motion your shoulder chooses."},
"incline-db":{n:"Incline DB Press",c:"str",e:"db",cue:"30–45° bench, ribs down, don't let the low back arch off. <b>Why:</b> builds the front shoulder without the impingement angle of flat barbell work."},
"landmine-press":{n:"Half-Kneeling Landmine Press",c:"str",e:"bb",cue:"Down knee on the same side as the pressing arm. Press up and slightly forward. Ribs down. <b>Why:</b> overhead-ish pressing in the scapular plane — safe for a throwing shoulder, and it trains anti-rotation for free."},
"ohp":{n:"Overhead Press",c:"str",e:"bb",cue:"Glutes and abs tight, head through at lockout. Only press overhead if you own the shoulder range pain-free. <b>Why:</b> true overhead strength, once mobility earns it."},
"chinup":{n:"Chin-Up / Assisted Chin-Up",c:"str",e:"bar",cue:"Start from a dead hang, pull the elbows into your ribs, chest to the bar. Lower for 3s. <b>Why:</b> lats connect your arm to your hips — the strongest link in the swing chain."},
"pulldown":{n:"Lat Pulldown",c:"str",e:"cable",cue:"Chest up, pull to the collarbone, no leaning back. <b>Why:</b> scalable vertical pulling while chin-up strength rebuilds."},
"db-row":{n:"One-Arm DB Row",c:"str",e:"db",cue:"Hips square, pull to the hip pocket, no torso twist. Pause 1s. <b>Why:</b> builds the back that decelerates a fast arm — and keeps the shoulders out of the slouch."},
"cs-row":{n:"Chest-Supported Row",c:"str",e:"db",cue:"Chest stays on the pad. Squeeze the blades, elbows to 45°. <b>Why:</b> pure upper-back work with zero cheating and zero low-back cost."},
"facepull":{n:"Face Pull",c:"str",e:"cable",cue:"Pull to the forehead, thumbs back, elbows high. Light weight, high reps. <b>Why:</b> the single best exercise for the rear cuff and mid-traps. Never skip it."},
"ext-rot":{n:"Band External Rotation @ 90°",c:"str",e:"band",cue:"Elbow at shoulder height, rotate the forearm back, 2s hold. Slow eccentric. <b>Why:</b> direct cuff strength — your throwing shoulder's maintenance bill, paid weekly."},
"ytw":{n:"Prone Y-T-W",c:"str",e:"none",cue:"Face down, thumbs up, lift low and long. Tiny range, big burn. <b>Why:</b> lower-trap and rear-delt endurance that fixes the desk-posture shoulder."},
"bu-carry":{n:"Bottoms-Up KB Carry",c:"str",e:"kb",cue:"Bell inverted, wrist straight, crush the handle. Walk tall. <b>Why:</b> reflexive cuff stability — the shoulder learns to hold itself together."},

/* --- core / carries --- */
"pallof":{n:"Pallof Press",c:"core",e:"cable",cue:"Stand tall side-on to the anchor, press straight out, resist the twist. 3s hold. <b>Why:</b> anti-rotation strength is the brake that lets you rotate hard safely."},
"farmer":{n:"Farmer Carry",c:"core",e:"db",cue:"Tall, ribs down, quiet steps. Heavy. <b>Why:</b> full-body tension and grip — grip strength shows up in clubhead control."},
"suitcase":{n:"Suitcase Carry",c:"core",e:"db",cue:"One side only. Don't lean either direction. <b>Why:</b> lateral core strength that stops the side-bend leak at impact."},
"side-plank":{n:"Side Plank",c:"core",e:"none",cue:"Stack the feet, drive the down elbow into the floor, hips high. <b>Why:</b> obliques and QL — the muscles that hold your spine angle."},
"copenhagen":{n:"Copenhagen Plank",c:"core",e:"bench",cue:"Top leg on a bench, lift the hips. Start with the knee on the bench version. <b>Why:</b> adductor strength — the most under-trained muscle in rotational sport."},
"hang-knee":{n:"Hanging Knee Raise",c:"core",e:"bar",cue:"No swinging. Curl the pelvis at the top. <b>Why:</b> trains the abs to control the pelvis, plus a free decompressing hang for the spine."},
"chop":{n:"Half-Kneeling Cable Chop",c:"core",e:"cable",cue:"Rotate from the mid-back, arms just hold the handle. Hips stay still. <b>Why:</b> trains hip-shoulder separation — the X-factor that makes clubhead speed."},
"lift":{n:"Half-Kneeling Cable Lift",c:"core",e:"cable",cue:"Low to high, follow the handle with your eyes. Down knee stays heavy. <b>Why:</b> the backswing pattern loaded — builds the turn you keep losing."},
"landmine-rot":{n:"Landmine Rotation",c:"core",e:"bb",cue:"Pivot the back foot, let the hips lead the arms. Control the return. <b>Why:</b> loaded rotation with a natural arc — it teaches the sequence, not just the strength."},

/* --- power / med ball --- */
"mb-rot-scoop":{n:"Med Ball Rotational Scoop Toss",c:"pow",e:"mb",cue:"Side-on to the wall, load the back hip, push the ground away and let the hips fire first. Throw HARD. Reset fully between reps. <b>Why:</b> the closest thing in the gym to a golf swing — trains the kinetic sequence at speed."},
"mb-shotput":{n:"Med Ball Shotput Toss",c:"pow",e:"mb",cue:"Ball at the shoulder, rotate and punch it into the wall. Back foot pivots. <b>Why:</b> upper-body rotational power layered on top of hip drive."},
"mb-slam":{n:"Med Ball Overhead Slam",c:"pow",e:"mb",cue:"Full reach overhead, drive the ball down with the abs, follow through. <b>Why:</b> teaches the trunk to produce force fast in the vertical plane."},
"mb-chest":{n:"Med Ball Chest Pass",c:"pow",e:"mb",cue:"Athletic stance, push explosively, catch and reset. <b>Why:</b> upper-body speed without the joint cost of heavy pressing."},
"mb-half-rot":{n:"Half-Kneeling Rotational Throw",c:"pow",e:"mb",cue:"Down knee blocks the hips — all the rotation comes from the trunk. <b>Why:</b> isolates thoracic rotational speed when the hips want to take over."},
"box-jump":{n:"Box Jump",c:"pow",e:"box",cue:"Land soft in the same position you took off from. Step down, never jump down. Quality over height. <b>Why:</b> rebuilds rate of force development — the first quality to fade and the first to come back."},
"lat-bound":{n:"Lateral Bound",c:"pow",e:"none",cue:"Push off the outside leg, stick the landing for 1 full second. <b>Why:</b> lateral force production and the ability to absorb it — exactly what the transition demands."},
"skater":{n:"Skater Hop",c:"pow",e:"none",cue:"Bound side to side, stick each landing. <b>Why:</b> single-leg elasticity and frontal-plane control."},
"jump-rope":{n:"Jump Rope",c:"cond",e:"rope",cue:"Small hops, wrists do the work. <b>Why:</b> ankle stiffness, coordination, and a low-cost heart-rate builder."},

/* --- conditioning --- */
"zone2":{n:"Zone 2 Cardio",c:"cond",e:"cardio",cue:"Bike, row, ruck or brisk incline walk. Nose-breathing pace — you can hold a conversation. <b>Why:</b> the aerobic base that makes 18 holes walking feel easy and speeds recovery between lifts."},
"bike-int":{n:"Bike / Row Intervals",c:"cond",e:"cardio",cue:"Hard effort, then easy spin to full recovery. Quality over grinding. <b>Why:</b> raises your ceiling without wrecking the next lifting day."},
"sled":{n:"Sled Push / March",c:"cond",e:"sled",cue:"Low angle, drive long steps. Heavy and short, or light and long. <b>Why:</b> conditioning with zero eccentric damage — you can push hard and still lift tomorrow."},
"incline-walk":{n:"Incline Walk",c:"cond",e:"cardio",cue:"10–12% grade, no holding the rails, 20–35 min. <b>Why:</b> joint-friendly base work that also builds calf and glute endurance for walking a course."},
"tempo-run":{n:"Tempo Runs",c:"cond",e:"none",cue:"~70% effort strides over 60–100 yards, full walk-back recovery. Only if the legs feel good. <b>Why:</b> reintroduces speed safely — the athletic quality that most says 'back in shape'."}
};

/* ---------------- STATE ---------------- */
const DEF=()=>({
  v:1, start:todayISO(), dpw:4, unit:"lb",
  log:{}, swaps:{}, mob:{}, bench:{pre:{},post:{}}, notes:{}, weekOverride:0
});
let S=DEF(), view="today", openSession=null, sheetOpen=false;

function todayISO(d){const t=d||new Date();return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
let STORAGE_OK=null;
function storageProbe(){
  try{localStorage.setItem("__bs_probe","1");localStorage.removeItem("__bs_probe");STORAGE_OK=true;}
  catch(e){STORAGE_OK=false;}
  return STORAGE_OK;
}
function store(k,val){try{if(val===undefined)return localStorage.getItem(k);localStorage.setItem(k,val);return true;}
  catch(e){STORAGE_OK=false;return null;}}
function dataSize(){try{return new Blob([JSON.stringify(S)]).size;}catch(e){return 0;}}
function fmtBytes(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";}
function save(){store("backswing.v1",JSON.stringify(S));}
function load(){try{const r=store("backswing.v1");if(r){const p=JSON.parse(r);S=Object.assign(DEF(),p);}}catch(e){}}

function daysSince(iso){const a=new Date(iso+"T00:00:00"),b=new Date(todayISO()+"T00:00:00");return Math.floor((b-a)/864e5);}
function curWeek(){if(S.weekOverride)return S.weekOverride;const w=Math.floor(daysSince(S.start)/7)+1;return Math.max(1,Math.min(12,w));}
function phaseOf(w){return w<=4?1:w<=8?2:3;}
function phaseObj(w){return PHASES[phaseOf(w)-1];}
function daysForWeek(){const p=phaseOf(curWeek());return DAYS[p];}
function activeDays(w){
  const p=DAYS[phaseOf(w)], n=S.dpw;
  if(n===3)return [p[0],p[1],p[2]];
  if(n===4)return [p[0],p[1],p[2],p[3]];
  return [p[0],p[1],p[2],p[3],p[4]];
}
const sid=(w,k)=>"w"+w+k;
function sess(w,k){return S.log[sid(w,k)]||null;}
function isDone(w,k){const s=sess(w,k);return !!(s&&s.done);}
function realEx(id){return S.swaps[id]||id;}
function exOf(id){return EX[realEx(id)]||EX[id]||{n:id,c:"str",cue:""};}

/* ---------------- helpers ---------------- */
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);}
const TAGC={strength:"strength",mobility:"mobility",power:"power",cond:"cond",str:"strength",mob:"mobility",pow:"power",core:"strength"};
function schemeFor(w){return SCHEME[w];}
function setsRepsFor(it,w){
  if(it.main){const s=schemeFor(w);return{sets:s.s,reps:s.r,extra:s.rpe};}
  return{sets:it.s,reps:it.r,extra:""};
}
function e1rm(w,r){w=+w;r=+r;if(!w||!r)return 0;return Math.round(w*(1+r/30));}

/* ---------------- REST TIMER ---------------- */
let T={left:0,run:false,iv:null};
function timerStart(sec,label){
  T.left=sec;T.run=true;
  document.getElementById("timerBar").classList.remove("hide");
  document.body.classList.add("timer-on");
  document.getElementById("tLabel").textContent=label||"Rest";
  paintTimer();clearInterval(T.iv);
  T.iv=setInterval(()=>{T.left--;paintTimer();if(T.left<=0){timerDone();}},1000);
}
function paintTimer(){
  const m=Math.floor(Math.max(0,T.left)/60),s=Math.max(0,T.left)%60;
  const v=document.getElementById("tVal");
  v.textContent=m+":"+String(s).padStart(2,"0");
  v.classList.toggle("warn",T.left<=10);
  document.getElementById("tSub").textContent=T.left>0?"next set when it hits zero":"go";
}
function timerDone(){clearInterval(T.iv);T.run=false;beep();
  document.getElementById("tLabel").textContent="Go";
  setTimeout(()=>{if(!T.run){document.getElementById("timerBar").classList.add("hide");document.body.classList.remove("timer-on");}},4000);}
function timerStop(){clearInterval(T.iv);T.run=false;
  document.getElementById("timerBar").classList.add("hide");document.body.classList.remove("timer-on");}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();
  [0,180,360].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  o.frequency.value=i===2?1046:784;g.gain.setValueAtTime(.0001,c.currentTime+d/1000);
  g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d/1000+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d/1000+.22);
  o.start(c.currentTime+d/1000);o.stop(c.currentTime+d/1000+.25);});
  if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}

/* ---------------- STATS ---------------- */
function allSessions(){return Object.entries(S.log).filter(([k,v])=>v&&v.done);}
function totalDone(){return allSessions().length;}
function weekDone(w){return activeDays(w).filter(d=>isDone(w,d.k)).length;}
function activeDates(){
  const set=new Set();
  allSessions().forEach(([k,v])=>{if(v.date)set.add(v.date);});
  Object.keys(S.mob||{}).forEach(d=>{if((S.mob[d]||[]).length)set.add(d);});
  return set;
}
/* consecutive days with either a logged session or a mobility routine.
   today not yet logged doesn't break yesterday's streak. */
function streak(){
  const set=activeDates();
  if(!set.size)return 0;
  const cur=new Date();
  if(!set.has(todayISO(cur)))cur.setDate(cur.getDate()-1);
  let n=0;
  while(set.has(todayISO(cur))&&n<400){n++;cur.setDate(cur.getDate()-1);}
  return n;
}
function volumeOfSession(s){let v=0;(Object.values(s.sets||{})).forEach(arr=>arr.forEach(x=>{if(x.done)v+=(+x.w||0)*(+x.r||0);}));return v;}
function weekVolume(w){let v=0;activeDays(w).forEach(d=>{const s=sess(w,d.k);if(s)v+=volumeOfSession(s);});return v;}
function bestFor(exId){
  let best=null;
  Object.values(S.log).forEach(s=>{const a=(s.sets||{})[exId];if(!a)return;
    a.forEach(x=>{if(!x.done)return;const e=e1rm(x.w,x.r);if(e&&(!best||e>best.e))best={e,w:+x.w,r:+x.r,date:s.date};});});
  return best;
}

}

      <div class="grow"><div style="font-weight:700;font-size:13.5px;margin-bottom:2px">This week's dial</div>
      <div class="muted">${esc(sc.note)}</div></div></div></div>`;
  }else{
    h+=`<div class="hero"><div class="hero-k">Week ${w} complete</div>

    h+=`<div class="wkdot ${dn?"done":""} ${isNext?"today":""}" onclick="startSession(${w},'${d.k}')"><i></i><em>${d.k}</em></div>`;});
  h+=`</div><div class="tiny" style="margin-top:10px">Tap any day to open or review it. Order is flexible — just keep a rest day between the two lower-body days.</div></div>`;

  h+=`<div class="sect-t">Every day, 10 minutes</div>`;

/* ---------- SESSION ---------- */
function startSession(w,k){window._sy=window.scrollY;openSession={w,k};render();}
function closeSession(){openSession=null;render();}
function viewSession(){
  const {w,k}=openSession, day=DAYS[phaseOf(w)].find(d=>d.k===k), sc=SCHEME[w];
  const s=S.log[sid(w,k)]||{date:null,done:false,sets:{},note:""};
  let h=`<div style="padding-top:14px">
    <button class="btn gho sm" onclick="closeSession()" style="margin-bottom:12px">&#8249; Back</button>
    <div class="hero" style="margin-top:0">
      <div class="hero-k">Week ${w} · Day ${k}</div><h2>${esc(day.n)}</h2>
      <div class="meta">~${day.dur} min · ${sc.rpe} on main lifts</div>
      <div class="tags"><span class="pill ${TAGC[day.tag]}">${day.tag}</span>
      <span class="pill">${sc.s}×${sc.r} mains</span>${s.done?'<span class="pill strength">completed</span>':""}</div>
    </div>`;
  let idx=0;
  day.blocks.forEach(b=>{
    h+=`<div class="sect-t">${esc(b.t)}</div><div class="exlist">`;
    b.items.forEach(it=>{
      idx++;
      const id=realEx(it.x), ex=EX[id]||EX[it.x], sr=setsRepsFor(it,w);
      const logged=(s.sets||{})[it.x]||[];
      const nSets=sr.sets||1;
      const allDone=logged.length>=nSets&&logged.slice(0,nSets).every(x=>x&&x.done);
      const trackable=["str","pow"].includes(ex.c)&&ex.e!=="cardio";
      h+=`<div class="ex ${allDone?"done":""}" id="ex-${idx}">
        <div class="ex-h" onclick="toggleEx(${idx})">
          <div class="ex-n">${allDone?"&#10003;":idx}</div>
          <div class="grow"><div class="ex-t">${esc(ex.n)}${S.swaps[it.x]?' <span class="tiny">(swapped)</span>':""}</div>
            <div class="ex-s">${sr.sets?sr.sets+" × "+sr.reps:sr.reps}${sr.extra?" · "+sr.extra:""}${it.rest?" · "+it.rest+"s rest":""}</div></div>
          <div class="chev">&#8250;</div></div>
        <div class="ex-b">
          <div class="cue">${ex.cue||""}</div>
          ${it.n?`<div class="muted" style="margin-bottom:10px">&#9755; ${esc(it.n)}</div>`:""}
          ${ALT[id]?`<div class="tiny" style="margin-bottom:10px"><b>No equipment?</b> ${esc(ALT[id])}</div>`:""}`;
      if(trackable){
        h+=`<div class="setg head"><div>#</div><div>${S.unit}</div><div>reps</div><div></div></div>`;
        for(let i=0;i<nSets;i++){
          const L=logged[i]||{};
          h+=`<div class="setg">
            <div class="sn">${i+1}</div>
            <input class="inp" type="number" inputmode="decimal" placeholder="—" value="${L.w!=null?L.w:""}" onchange="setLog('${it.x}',${i},'w',this.value)">
            <input class="inp" type="number" inputmode="numeric" placeholder="${String(sr.reps).replace(/[^0-9].*$/,"")||""}" value="${L.r!=null?L.r:""}" onchange="setLog('${it.x}',${i},'r',this.value)">
            <button class="chk ${L.done?"on":""}" onclick="toggleSet('${it.x}',${i},${it.rest||90})">&#10003;</button>
          </div>`;
        }
        const b2=bestFor(it.x);
        h+=`<div class="prev">${b2?`Best so far: ${b2.w}${S.unit} × ${b2.r} (est. 1RM ${b2.e}${S.unit})`:"No history yet — today sets the baseline."}</div>`;
      }else{
        const L=logged[0]||{};
        h+=`<button class="btn ${L.done?"sec":"blue"} sm" style="width:100%" onclick="toggleSet('${it.x}',0,${it.rest||0})">${L.done?"&#10003; Done":"Mark complete"}</button>`;
      }
      h+=`<button class="btn gho sm" style="width:100%;margin-top:9px" onclick="swapSheet('${it.x}')">Swap this exercise</button>
        </div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="sect-t">Session notes</div>
    <div class="card"><textarea class="inp" style="text-align:left;min-height:80px;resize:vertical" placeholder="How did it feel? Anything cranky? What to load up next time." onchange="setNote(this.value)">${esc(s.note||"")}</textarea></div>
    <div style="margin:18px 0 30px">
      <button class="btn" onclick="finishSession()">${s.done?"Update session":"Finish &amp; log workout"}</button>
      ${s.done?'<button class="btn gho" style="margin-top:9px" onclick="unfinish()">Mark not done</button>':""}
    </div></div>`;
  return h;
}
function toggleEx(i){document.getElementById("ex-"+i).classList.toggle("open");}
function ensureSess(){const {w,k}=openSession,id=sid(w,k);
  if(!S.log[id])S.log[id]={date:null,done:false,sets:{},note:""};return S.log[id];}
function setLog(x,i,f,v){const s=ensureSess();s.sets[x]=s.sets[x]||[];s.sets[x][i]=s.sets[x][i]||{};
  s.sets[x][i][f]=v===""?null:v;save();}
function toggleSet(x,i,rest){const s=ensureSess();s.sets[x]=s.sets[x]||[];s.sets[x][i]=s.sets[x][i]||{};
  const cur=!s.sets[x][i].done;s.sets[x][i].done=cur;
  save();
  const scrollY=window.scrollY;
  const openIds=[...document.querySelectorAll(".ex.open")].map(e=>e.id);
  render();
  openIds.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add("open");});
  window.scrollTo(0,scrollY);
  if(cur&&rest)timerStart(rest,"Rest");
}
function setNote(v){const s=ensureSess();s.note=v;save();}
function finishSession(){const s=ensureSess();s.done=true;s.date=s.date||todayISO();save();
  toast("Logged. Nice work.");openSession=null;view="today";render();}
function unfinish(){const s=ensureSess();s.done=false;save();render();}

function swapSheet(x){
  const cur=realEx(x), cat=(EX[cur]||{}).c;
  const opts=Object.entries(EX).filter(([id,e])=>e.c===cat&&id!==cur);
  let h=`<h3 style="margin-bottom:4px">Swap exercise</h3>
   <div class="muted" style="margin-bottom:14px">Replaces ${esc((EX[cur]||{}).n)} everywhere in the program. Your logged history stays attached to the slot.</div>`;
  if(S.swaps[x])h+=`<button class="btn sec sm" style="width:100%;margin-bottom:10px" onclick="doSwap('${x}',null)">Reset to original</button>`;
  opts.forEach(([id,e])=>{h+=`<div class="card" style="margin:8px 0;cursor:pointer" onclick="doSwap('${x}','${id}')">
    <div style="font-weight:700">${esc(e.n)}</div><div class="tiny" style="margin-top:3px">${e.cue.replace(/<[^>]+>/g,"").slice(0,95)}…</div></div>`;});
  sheet(h);
}
function doSwap(x,to){if(to)S.swaps[x]=to;else delete S.swaps[x];save();closeSheet();render();toast(to?"Swapped":"Reset");}

/* ---------- PLAN ---------- */
function viewPlan(){
  const cw=curWeek();
  let h=`<div class="sect-t" style="margin-top:16px">12-Week Program</div>
  <div class="card flat"><div class="muted">Built around a rebuilt baseball body: rotational power, hip and t-spine range, a shoulder that's had mileage, and single-leg strength. Four lifting days is the sweet spot — three works, five adds a pure mobility and aerobic day.</div></div>`;
  PHASES.forEach(p=>{
    h+=`<div class="phase ${p.cls}"><h3>Phase ${p.id} — ${p.name}</h3>
      <div class="tiny" style="margin-top:2px">${p.wk}</div><p>${p.desc}</p></div>`;
    for(let w=(p.id-1)*4+1;w<=p.id*4;w++){
      const days=activeDays(w),dn=days.filter(d=>isDone(w,d.k)).length,sc=SCHEME[w];
      h+=`<div class="wk ${w===cw?"open":""}" id="wk-${w}">
        <div class="wk-h" onclick="document.getElementById('wk-${w}').classList.toggle('open')">
          <div class="grow"><b>Week ${w}${w===cw?" · current":""}</b>
            <div class="tiny">${sc.s}×${sc.r} mains · ${sc.rpe}</div></div>
          ${dn?`<span class="pill ${dn===days.length?"strength":""}">${dn}/${days.length}</span>`:`<span class="pill rest">${days.length} days</span>`}
          <div class="chev">&#8250;</div></div>
        <div class="wk-b">
          <div style="padding:10px 14px 4px" class="tiny">${esc(sc.note)}</div>`;
      days.forEach(d=>{
        h+=`<div class="dayrow ${isDone(w,d.k)?"done":""}" onclick="startSession(${w},'${d.k}')">
          <div class="dn">${isDone(w,d.k)?"&#10003;":d.k}</div>
          <div class="grow"><div class="t">${esc(d.n)}</div><div class="s">~${d.dur} min · ${d.blocks.reduce((a,b)=>a+b.items.length,0)} movements</div></div>
          <div class="chev">&#8250;</div></div>`;});
      h+=`</div></div>`;
    }
  });
  h+=`<div class="sect-t">How to lay out the week</div><div class="card">
   <div class="muted" style="margin-bottom:10px">A template that works with golf on the weekend:</div>
   <div class="tiny" style="line-height:2">
   <b style="color:var(--tx)">Mon</b> — Day A (lower, squat)<br>
   <b style="color:var(--tx)">Tue</b> — Day B (upper) + daily flow<br>
   <b style="color:var(--tx)">Wed</b> — daily flow + easy walk<br>
   <b style="color:var(--tx)">Thu</b> — Day C (hinge + rotation)<br>
   <b style="color:var(--tx)">Fri</b> — Day D (upper, pull)<br>
   <b style="color:var(--tx)">Sat</b> — golf · pre-round warm-up<br>
   <b style="color:var(--tx)">Sun</b> — Day E or recovery flow</div>
   <div class="tiny" style="margin-top:12px;color:var(--tx2)">If you're playing Saturday, keep Friday's session to the listed loads — don't chase a PR the day before a round. Rotational throw days (C) are best 48 hours out from playing.</div>
   </div><div style="height:20px"></div>`;
  return h;
}

/* ---------- MOBILITY ---------- */
function viewMob(){
  const t=todayISO(),done=S.mob[t]||[];
  let h=`<div class="sect-t" style="margin-top:16px">Mobility &amp; Maintenance</div>
   <div class="card flat"><div class="muted">Strength you can't express through range is wasted. For a golfer with a baseball past, three things decide everything: <b>t-spine rotation</b>, <b>hip internal rotation</b>, and <b>a healthy posterior shoulder</b>. Everything here targets those.</div></div>`;
  ROUTINES.forEach(r=>{
    const d=done.includes(r.id);
    h+=`<div class="card" onclick="openRoutine('${r.id}')" style="cursor:pointer">
      <div class="row"><div class="grow">
        <div class="row" style="gap:8px"><div style="font-weight:700;font-size:15.5px">${esc(r.n)}</div>
        ${d?'<span class="pill strength">done today</span>':""}</div>
        <div class="muted" style="margin-top:2px">${esc(r.sub)}</div></div>
        <div class="chev">&#8250;</div></div></div>`;
  });
  h+=`<div class="sect-t">The three limiters</div>
  <div class="card"><div style="font-weight:700;color:var(--acc2)">1 · Thoracic rotation</div>
   <div class="muted" style="margin:4px 0 12px">You need ~45° of upper-back turn each way. Short of that, the low back and lead shoulder make up the difference — and that's where golfers get hurt. Open books and t-spine extension, daily.</div>
   <div style="font-weight:700;color:var(--acc2)">2 · Hip internal rotation</div>
   <div class="muted" style="margin:4px 0 12px">The lead hip has to internally rotate to clear through impact. Baseball built you a dominant back hip and a tight lead one. 90/90 switches are the fix.</div>
   <div style="font-weight:700;color:var(--acc2)">3 · Posterior shoulder</div>
   <div class="muted" style="margin-top:4px">Every throwing shoulder loses internal rotation and rear-cuff strength. Face pulls, band external rotations and the cross-body stretch keep it quiet for the next thirty years.</div>
  </div><div style="height:20px"></div>`;
  return h;
}
function openRoutine(id){
  const r=ROUTINES.find(x=>x.id===id),t=todayISO(),done=(S.mob[t]||[]).includes(id);
  let h=`<h3>${esc(r.n)}</h3><div class="muted" style="margin:3px 0 10px">${esc(r.sub)}</div>
   <div class="cue" style="margin-bottom:14px">${esc(r.d)}</div><div class="exlist">`;
  r.items.forEach((it,i)=>{const ex=EX[it.x];
    h+=`<div class="ex" id="rx-${i}"><div class="ex-h" onclick="document.getElementById('rx-${i}').classList.toggle('open')">
      <div class="ex-n">${i+1}</div><div class="grow"><div class="ex-t">${esc(ex.n)}</div>
      <div class="ex-s">${it.s>1?it.s+" × ":""}${it.r}</div></div><div class="chev">&#8250;</div></div>
      <div class="ex-b"><div class="cue" style="margin:0">${ex.cue}</div></div></div>`;});
  h+=`</div><div style="margin-top:16px">
    <button class="btn ${done?"sec":""}" onclick="markMob('${id}')">${done?"&#10003; Completed today":"Mark complete"}</button></div>`;
  sheet(h);
}
function markMob(id){const t=todayISO();S.mob[t]=S.mob[t]||[];
  if(S.mob[t].includes(id))S.mob[t]=S.mob[t].filter(x=>x!==id);else S.mob[t].push(id);
  save();closeSheet();render();toast("Mobility logged");}

/* ---------- PROGRESS ---------- */
function viewProgress(){
  const cw=curWeek();
  let h=`<div class="sect-t" style="margin-top:16px">Progress</div>`;
  const totalPlanned=12*S.dpw, pct=Math.round(totalDone()/totalPlanned*100);
  h+=`<div class="stats">
    <div class="stat"><b>${totalDone()}</b><span>sessions</span></div>
    <div class="stat"><b>${pct}%</b><span>of program</span></div>
    <div class="stat"><b>${streak()}</b><span>day streak</span></div></div>`;

  /* sessions per week chart */
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:2px">Sessions per week</div>
   <div class="tiny" style="margin-bottom:6px">Consistency beats intensity over 12 weeks.</div><div class="bars">`;
  for(let w=1;w<=12;w++){const d=weekDone(w),max=S.dpw;
    h+=`<div class="barc"><div class="bar" style="height:${Math.max(3,d/max*100)}%;${d===0?"opacity:.22":""}"></div><em>${w}</em></div>`;}
  h+=`</div></div>`;

  /* volume chart */
  const vols=[];for(let w=1;w<=12;w++)vols.push(weekVolume(w));
  const mx=Math.max(...vols,1);
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:2px">Weekly tonnage</div>
   <div class="tiny" style="margin-bottom:6px">Total ${S.unit} lifted. Expect it to climb through a phase, then dip on deload weeks — that's the design.</div><div class="bars">`;
  vols.forEach((v,i)=>{h+=`<div class="barc"><div class="bar blue" style="height:${Math.max(3,v/mx*100)}%;${v===0?"opacity:.22":""}"></div><em>${i+1}</em></div>`;});
  h+=`</div><div class="tiny" style="margin-top:8px">Best week: ${mx>1?Math.round(mx).toLocaleString()+" "+S.unit:"—"}</div></div>`;

  /* key lifts */
  h+=`<div class="sect-t">Key lifts — estimated 1RM</div><div class="card">`;
  const seen=new Set();
  Object.values(S.log).forEach(s=>Object.keys(s.sets||{}).forEach(k=>seen.add(k)));
  const keys=[...seen].map(k=>({k,b:bestFor(k)})).filter(o=>o.b&&o.b.e)
    .sort((a,b)=>b.b.e-a.b.e).slice(0,10).map(o=>o.k);
  let any=false;
  keys.forEach(k=>{const b=bestFor(k);if(!b||!EX[k])return;any=true;
    h+=`<div class="toggle"><div><div style="font-weight:600">${esc(EX[k].n)}</div>
      <div class="tiny">${b.w}${S.unit} × ${b.r} · ${b.date||""}</div></div>
      <div style="font-size:19px;font-weight:800;color:var(--acc)">${b.e}<span style="font-size:11px;color:var(--tx3)"> ${S.unit}</span></div></div>`;});
  if(!any)h+=`<div class="muted">Log a few sets and your best lifts show up here automatically.</div>`;
  h+=`</div>`;

  /* benchmarks */
  h+=`<div class="sect-t">Benchmarks — week 1 vs week 12</div>
   <div class="card flat"><div class="muted">Test these in week 1 and again in week 12. This is the honest scoreboard.</div></div><div class="card">`;
  BENCH.forEach(b=>{
    const pre=S.bench.pre[b.id]||"",post=S.bench.post[b.id]||"";
    const delta=(pre&&post)?(((+post-+pre)/+pre)*100):null;
    h+=`<div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <div style="font-weight:600;font-size:14.5px">${esc(b.n)}</div>
      <div class="tiny" style="margin:2px 0 8px">${esc(b.w)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 62px;gap:8px;align-items:center">
        <input class="inp" inputmode="decimal" placeholder="wk 1" value="${esc(pre)}" onchange="setBench('pre','${b.id}',this.value)">
        <input class="inp" inputmode="decimal" placeholder="wk 12" value="${esc(post)}" onchange="setBench('post','${b.id}',this.value)">
        <div style="text-align:right;font-weight:800;font-size:14px;color:${delta===null?"var(--tx3)":delta>=0?"var(--acc)":"var(--acc4)"}">
          ${delta===null?"—":(delta>=0?"+":"")+delta.toFixed(0)+"%"}</div>
      </div></div>`;});
  h+=`</div>`;

  /* history */
  const hist=Object.entries(S.log).filter(([k,v])=>v.done)
    .sort((a,b)=>String(b[1].date).localeCompare(String(a[1].date)));
  h+=`<div class="sect-t">History</div>`;
  if(!hist.length)h+=`<div class="empty"><div class="ic">&#9675;</div>No sessions logged yet.</div>`;
  else{h+=`<div class="card" style="padding:4px 16px">`;
    hist.slice(0,30).forEach(([k,v])=>{
      const w=+k.slice(1,-1),dk=k.slice(-1),day=(DAYS[phaseOf(w)]||[]).find(d=>d.k===dk);
      h+=`<div class="toggle"><div><div style="font-weight:600;font-size:14px">${esc(day?day.n:k)}</div>
        <div class="tiny">Week ${w} · Day ${dk} · ${v.date||"—"}</div></div>
        <div style="text-align:right"><div style="font-weight:700;font-size:13px">${Math.round(volumeOfSession(v)).toLocaleString()}</div>
        <div class="tiny">${S.unit}</div></div></div>`;});
    h+=`</div>`;}
  h+=`<div style="height:24px"></div>`;
  return h;
}
function setBench(kind,id,v){S.bench[kind][id]=v;save();
  const y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- LIBRARY ---------- */
let libQ="",libCat="all";
function viewLibrary(){
  const cats=[["all","All"],["str","Strength"],["pow","Power"],["mob","Mobility"],["core","Core"],["cond","Cardio"]];
  let h=`<div class="sect-t" style="margin-top:16px">Exercise Library</div>
   <input class="search" id="libS" placeholder="Search exercises…" value="${esc(libQ)}" oninput="libQ=this.value;paintLib()">
   <div class="seg">${cats.map(c=>`<button class="${libCat===c[0]?"on":""}" onclick="libCat='${c[0]}';render()">${c[1]}</button>`).join("")}</div>
   <div id="libList"></div>`;
  setTimeout(paintLib,0);
  return h;
}
function paintLib(){
  const box=document.getElementById("libList");if(!box)return;
  const q=libQ.toLowerCase();
  const list=Object.entries(EX).filter(([id,e])=>
    (libCat==="all"||e.c===libCat)&&(!q||e.n.toLowerCase().includes(q)||e.cue.toLowerCase().includes(q)));
  if(!list.length){box.innerHTML=`<div class="empty"><div class="ic">&#9906;</div>Nothing matches "${esc(libQ)}"</div>`;return;}
  box.innerHTML=`<div class="exlist">`+list.map(([id,e],i)=>`
    <div class="ex" id="lb-${i}"><div class="ex-h" onclick="document.getElementById('lb-${i}').classList.toggle('open')">
      <div class="ex-n" style="font-size:10px">${(e.c||"").toUpperCase().slice(0,3)}</div>
      <div class="grow"><div class="ex-t">${esc(e.n)}</div><div class="ex-s">${EQN[e.e]||e.e}</div></div>
      <div class="chev">&#8250;</div></div>
      <div class="ex-b"><div class="cue" style="margin:0">${e.cue}</div>
      ${ALT[id]?`<div class="tiny" style="margin-top:10px"><b>No equipment?</b> ${esc(ALT[id])}</div>`:""}</div></div>`).join("")+`</div><div style="height:20px"></div>`;
}
const EQN={none:"Bodyweight",db:"Dumbbells",bb:"Barbell",kb:"Kettlebell",band:"Band",cable:"Cable",bar:"Pull-up bar",
 mb:"Med ball",box:"Box",roller:"Foam roller",wall:"Wall",club:"Golf club",bench:"Bench",sled:"Sled",rope:"Jump rope",cardio:"Cardio machine"};

/* ---------- SETTINGS ---------- */
function settingsSheet(){
  const w=curWeek();
  let h=`<h3 style="margin-bottom:14px">Settings</h3>
  <div class="card" style="margin-top:0">
    <div style="font-weight:700;margin-bottom:4px">Days per week</div>
    <div class="tiny" style="margin-bottom:10px">Three still covers squat, upper and hinge+rotation. Five adds a pure mobility and aerobic day.</div>
    <div class="seg" style="margin:0">
      ${[3,4,5].map(n=>`<button class="${S.dpw===n?"on":""}" onclick="setDpw(${n})">${n} days</button>`).join("")}
    </div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">Units</div>
    <div class="seg" style="margin:8px 0 0">
      ${["lb","kg"].map(u=>`<button class="${S.unit===u?"on":""}" onclick="S.unit='${u}';save();settingsSheet();render()">${u}</button>`).join("")}
    </div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">Program start date</div>
    <div class="tiny" style="margin-bottom:10px">Currently on week ${w}. Change this if you started earlier or want to reset the clock.</div>
    <input class="inp" type="date" style="text-align:left" value="${S.start}" onchange="S.start=this.value;S.weekOverride=0;save();settingsSheet();render()">
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">Jump to a week</div>
    <div class="tiny" style="margin-bottom:10px">Pins the app to a specific week regardless of the date. Set to Auto to follow the calendar.</div>
    <select class="inp" style="text-align:left" onchange="S.weekOverride=+this.value;save();settingsSheet();render()">
      <option value="0"${!S.weekOverride?" selected":""}>Auto (by date)</option>
      ${Array.from({length:12},(_,i)=>`<option value="${i+1}"${S.weekOverride===i+1?" selected":""}>Week ${i+1}</option>`).join("")}
    </select>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">Your data</div>
    <div class="tiny" style="margin-bottom:10px">Everything is stored on this device only — nothing is uploaded anywhere.</div>
    <div class="tiny" style="margin-bottom:12px;padding:9px 11px;border-radius:9px;background:var(--bg2);border-left:2px solid ${STORAGE_OK===false?"var(--acc3)":"var(--acc)"}">
      <b>Saving: ${STORAGE_OK===false?"NOT working here":"working"}</b><br>
      ${totalDone()} sessions logged · ${fmtBytes(dataSize())} of data<br>
      A full 12 weeks lands around 40&ndash;60 KB — far below any device limit.</div>
    <button class="btn sec sm" style="width:100%;margin-bottom:8px" onclick="copyBackup()">Copy backup to clipboard</button>
    <button class="btn gho sm" style="width:100%;margin-bottom:8px" onclick="pasteBackup()">Restore from clipboard text</button>
    <button class="btn gho sm" style="width:100%;margin-bottom:8px" onclick="doExport()">Export backup file (.json)</button>
    <button class="btn gho sm" style="width:100%;margin-bottom:8px" onclick="document.getElementById('impF').click()">Import backup file</button>
    <input type="file" id="impF" accept=".json,application/json" class="hide" onchange="doImport(this)">
    <button class="btn danger sm" style="width:100%" onclick="wipe()">Reset all progress</button>
  </div>
  <div class="card flat">
    <div style="font-weight:700;margin-bottom:6px">How to use this</div>
    <div class="muted" style="font-size:13px">Open <b>Today</b>, hit start, tap each exercise to see the cue, type weight and reps, check the box — the rest timer fires automatically. Finish the session and it's logged. The daily mobility flow is the part that actually changes your golf swing; do it even on off days.</div>
  </div>
  <div class="tiny" style="text-align:center;padding:6px 0 4px">BACKSWING · 12-week strength &amp; mobility<br>Not medical advice. If something hurts sharply, stop and get it looked at.</div>`;
  sheet(h);
}
function setDpw(n){S.dpw=n;save();settingsSheet();render();toast(n+" days per week");}
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="backswing-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Backup downloaded");
}
function doImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);S=Object.assign(DEF(),p);save();closeSheet();render();toast("Backup restored");}
    catch(e){toast("Couldn't read that file");}};
  r.readAsText(f);
}
async function copyBackup(){
  const txt=JSON.stringify(S);
  try{await navigator.clipboard.writeText(txt);toast("Backup copied — paste it somewhere safe");}
  catch(e){
    sheet(`<h3 style="margin-bottom:8px">Backup text</h3>
     <div class="muted" style="margin-bottom:10px">Select all of this and copy it into Notes or an email to yourself.</div>
     <textarea class="inp" style="text-align:left;min-height:220px;font-size:11px" onclick="this.select()">${esc(txt)}</textarea>`);
  }
}
async function pasteBackup(){
  let txt=null;
  try{txt=await navigator.clipboard.readText();}catch(e){txt=prompt("Paste your backup text here:");}
  if(!txt)return;
  try{const p=JSON.parse(txt);S=Object.assign(DEF(),p);save();closeSheet();render();toast("Backup restored");}
  catch(e){toast("That didn't look like a backup");}
}
function wipe(){if(!confirm("Erase all logged workouts and settings? This cannot be undone."))return;
  S=DEF();save();closeSheet();view="today";render();toast("Reset");}

/* ---------- NAV / INIT ---------- */
function go(v){view=v;openSession=null;window._sy=0;render();}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;go(b.dataset.v);});
document.getElementById("btnSettings").onclick=settingsSheet;
document.getElementById("btnTimer").onclick=()=>{
  sheet(`<h3 style="margin-bottom:12px">Rest timer</h3>
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
   ${[45,60,90,120,150,180].map(s=>`<button class="btn sec" onclick="timerStart(${s},'Rest');closeSheet()">${s<60?s+"s":Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}</button>`).join("")}
   </div><div class="tiny" style="margin-top:14px">The timer also starts on its own each time you check off a set.</div>`);
};
document.getElementById("sheetBg").onclick=closeSheet;
document.getElementById("tPlus").onclick=()=>{T.left+=30;if(!T.run){T.run=true;timerStart(T.left,"Rest");}paintTimer();};
document.getElementById("tStop").onclick=timerStop;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(sheetOpen)closeSheet();else if(openSession)closeSession();}});

/* ---------- offline service worker ---------- */
const APP_VERSION="1.0.0";
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed"&&navigator.serviceWorker.controller){
            toast("Update ready — reopen the app");
          }
        });
      });
    }).catch(()=>{});
  });
}
storageProbe();
load();
if(!store("backswing.v1"))save();
render();
</script>
